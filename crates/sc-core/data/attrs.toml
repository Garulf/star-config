# Known attributes.xml settings. Values are strings as they appear in the file.
# kind is one of: bool, float (with min, max, step), raw_int, text.

[[attr]]
name = "HeadtrackingSource"
label = "Source"
group = "Head tracking"
kind = "raw_int"
default = "0"
cvar = "g_headtrackingSource"
note = "Which number means which device is not confirmed. Check the in-game menu."

[[attr]]
name = "HeadtrackingToggle"
label = "Enabled"
group = "Head tracking"
kind = "bool"
default = "0"
cvar = "g_headtrackingToggleEnabled"

[[attr]]
name = "HeadtrackingToggleAutoCalibrate"
label = "Recalibrate when enabled"
group = "Head tracking"
kind = "bool"
default = "1"
cvar = "g_headtrackingToggleAutoRecalibrate"

[[attr]]
name = "HeadtrackingGlobalSmoothingPosition"
label = "Position smoothing"
group = "Head tracking"
kind = "float"
min = 0.0
max = 1.0
step = 0.01
default = "0.0"
cvar = "g_headtrackingGlobalSmoothingPosition"
note = "Range is a guess. Type a value to go outside it."

[[attr]]
name = "HeadtrackingGlobalSmoothingRotation"
label = "Rotation smoothing"
group = "Head tracking"
kind = "float"
min = 0.0
max = 1.0
step = 0.01
default = "0.0"
cvar = "g_headtrackingGlobalSmoothingRotation"
note = "Range is a guess. Type a value to go outside it."

[[attr]]
name = "HeadtrackingInactivityTime"
label = "Inactivity time"
group = "Head tracking"
kind = "float"
min = 0.0
max = 30.0
step = 0.5
default = "2.0"
cvar = "g_headtrackingInactivityTime"
note = "Range is a guess. Type a value to go outside it."

[[attr]]
name = "HeadtrackingEnableSeatPositionOffset"
label = "Seat position offset"
group = "Head tracking"
kind = "bool"
default = "1"
cvar = "g_headtrackingSeatPositionOffsetEnabled"

[[attr]]
name = "HeadtrackingEnableRollSeat"
label = "Roll while seated"
group = "Head tracking"
kind = "bool"
default = "1"
cvar = "g_headtrackingRollSeatEnabled"

[[attr]]
name = "HeadtrackingEnableRollFPS"
label = "Roll on foot"
group = "Head tracking"
kind = "bool"
default = "0"
cvar = "g_headtrackingRollFPSEnabled"

[[attr]]
name = "HeadtrackingHoldUseRawDuringHold"
label = "Raw values while held"
group = "Head tracking"
kind = "bool"
default = "0"
cvar = "g_headtrackingHoldUseRawValuesDuringHold"

[[attr]]
name = "HeadtrackingDisableDuringSeat"
label = "Off while seated"
group = "Head tracking: when it is off"
kind = "bool"
default = "0"
cvar = "g_headtrackingToggleDisableDuringSeat"

[[attr]]
name = "HeadtrackingDisableDuringWalking"
label = "Off on foot"
group = "Head tracking: when it is off"
kind = "bool"
default = "1"
cvar = "g_headtrackingToggleDisableDuringWalking"

[[attr]]
name = "HeadtrackingDisableDuringADS"
label = "Off while aiming"
group = "Head tracking: when it is off"
kind = "bool"
default = "1"
