[[attr]]
name = "HeadtrackingThirdPersonCameraToggle"
label = "Third person camera"
group = "Head tracking: third person"
kind = "bool"
default = "0"
cvar = "g_headtrackingThirdPersonCameraEnabled"

[[attr]]
name = "HeadtrackingThirdPersonDisableDuringInventory"
label = "Off in inventory"
