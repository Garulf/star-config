kind = "bool"
default = "1"
cvar = "g_headtrackingToggleDisableVehicleAds"

[[attr]]
name = "HeadtrackingDisableDuringMobiGlas"
label = "Off in mobiGlas"
group = "Head tracking: when it is off"
kind = "bool"
default = "1"
cvar = "g_headtrackingToggleDisableDuringMobiglass"

[[attr]]
name = "HeadtrackingDisableDuringIM"
label = "Off in interaction mode"
group = "Head tracking: when it is off"
