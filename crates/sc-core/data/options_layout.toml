# Where each attributes.xml setting sits in the game's Options menu.
#
# The menu is compiled into the game, so this file is kept by hand. tools/options_layout_draft.py
# drafts new entries per patch; check them against the in-game menu. It holds names, game string
# keys and our own wording only, never text from the game's files. A fallback is shown when the
# game's strings are unavailable.
#
# kind: toggle | slider (min, max, step) | number | choice (choices) | text
# A range is stated only when it is known. The slider ranges below are guesses carried over from
# the first catalogue; a number field is used wherever none is known.
#
# These 18 entries come from the first catalogue. The tab and the section names are our own
# grouping and are not confirmed against the in-game menu.

[[tab]]
key = "pause_ForegroundOptionMenuButtonCommsSettings"
fallback = "Comms and head tracking"

[[tab.section]]
fallback = "Head tracking"

[[tab.section.entry]]
